<html>
    <head>
        <link rel="stylesheet" href="popup.css">
        <script src="script.js"></script>
    </head>
    <body>
        <h1>New Bookmark</h1>
        <div>
        <label for="name">Name:</label>
        <input
            type="text"
            id="nameField"
            name="name"
            required
        >
        </div>
        <div>
        <label for="url">URL:</label>
        <input
            type="text"
            id="urlField"
            name="url"
            required
        >
        </div>
        <div>
        <label for="folderSelector">Folder:</label>
    <select
    name="folder"
    id="folder">
    <option value="Other Bookmarks">Other Bookmarks</option>

    </select>
    </div>
    <div>
        <button id="saveButton" title="Save Bookmark">Save</button>
        <button id="clearButton" title="Clear All Fields">New</button>
    </div>
    </body>
</html>
